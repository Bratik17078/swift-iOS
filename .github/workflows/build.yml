name: Build unsigned IPA

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - sg-keep-view-once

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build device IPA (unsigned, ad-hoc)
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Checkout (with submodules, full history for build number)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Read required Xcode version
        run: |
          REQUIRED_XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          echo "Required Xcode: $REQUIRED_XCODE_VERSION"
          echo "REQUIRED_XCODE_VERSION=$REQUIRED_XCODE_VERSION" >> $GITHUB_ENV

      - name: Install and select Xcode ${{ env.REQUIRED_XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.REQUIRED_XCODE_VERSION }}

      - name: Make sure the Metal toolchain is available
        run: |
          xcrun metal --version || true
          xcodebuild -downloadMetalToolchain >/tmp/metal.log 2>&1 || true

      - name: Free disk space
        run: |
          set -x
          df -h /
          SELECTED=$(xcode-select -p)
          for x in /Applications/Xcode*.app; do
            if [ "$x" != "$SELECTED" ]; then
              sudo rm -rf "$x"
            fi
          done
          sudo rm -rf "$HOME/Library/Android/sdk" /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/homebrew/Caskroom 2>/dev/null || true
          df -h /

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Copy artifacts back to workspace
        run: |
          set -x
          mkdir -p build/artifacts
          cp /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa build/artifacts/
          cp /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip build/artifacts/ || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-unsigned
          path: build/artifacts/*
          compression-level: 0
          retention-days: 14
